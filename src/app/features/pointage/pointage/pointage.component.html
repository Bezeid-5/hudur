<header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white px-4 py-4 sm:px-8">
	<div>
		<p class="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-600">Hudur</p>
		@if (user(); as currentUser) {
			<p class="mt-1 text-sm text-slate-600">Bonjour {{ currentUser.displayName || currentUser.email }}</p>
		}
	</div>
	<button class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200" type="button" (click)="logout()">Se déconnecter</button>
</header>
